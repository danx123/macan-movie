name: Build Media Engine

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  cross-build-windows:
    name: Cross-compile Windows wheel (abi3)
    runs-on: ubuntu-latest
    env:
      FFMPEG_TAG: n9.0

    steps:
      - uses: actions/checkout@v4

      - name: Pasang toolchain cross mingw-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-mingw-w64-x86-64 \
            g++-mingw-w64-x86-64 \
            binutils-mingw-w64-x86-64 \
            nasm \
            yasm \
            pkg-config \
            make \
            diffutils \
            autoconf \
            automake \
            libtool \
            patch

          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix

      - name: Pasang Rust + target windows-gnu
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-gnu
          
      - name: Pasang Meson & Ninja (buat libdav1d)
        run: pip install meson ninja

      - name: 💾 Cache FFmpeg hasil cross-compile
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg-windows
          key: ffmpeg-windows-${{ env.FFMPEG_TAG }}-v26-mp3lame-vorbis-${{ hashFiles('.github/workflows/build.yml') }}

      - name: 🎬 Kompilasi libdav1d statis (cross ke Windows)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://code.videolan.org/videolan/dav1d.git dav1d-src
          cd dav1d-src
          
          cat <<EOF > cross_file.txt
          [binaries]
          c = 'x86_64-w64-mingw32-gcc-posix'
          cpp = 'x86_64-w64-mingw32-g++-posix'
          ar = 'x86_64-w64-mingw32-ar'
          strip = 'x86_64-w64-mingw32-strip'
          pkgconfig = 'pkg-config'
          windres = 'x86_64-w64-mingw32-windres'

          [host_machine]
          system = 'windows'
          cpu_family = 'x86_64'
          cpu = 'x86_64'
          endian = 'little'
          EOF
          
          meson setup build --cross-file cross_file.txt --default-library static --prefix="$HOME/ffmpeg-windows" --libdir="lib"
          ninja -C build
          ninja -C build install

      - name: 🎼 Kompilasi libmp3lame statis (cross ke Windows)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          curl -L -o lame.tar.gz "https://sourceforge.net/projects/lame/files/lame/3.100/lame-3.100.tar.gz/download"
          tar xzf lame.tar.gz
          cd lame-3.100

          ./configure \
            --prefix="$HOME/ffmpeg-windows" \
            --host=x86_64-w64-mingw32 \
            --disable-shared \
            --enable-static \
            --disable-frontend

          make -j"$(nproc)"
          make install

      - name: 🎵 Kompilasi libogg statis (cross ke Windows)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          curl -L -o libogg.tar.gz "https://downloads.xiph.org/releases/ogg/libogg-1.3.5.tar.gz"
          tar xzf libogg.tar.gz
          cd libogg-1.3.5

          ./configure \
            --prefix="$HOME/ffmpeg-windows" \
            --host=x86_64-w64-mingw32 \
            --disable-shared \
            --enable-static

          make -j"$(nproc)"
          make install

      - name: 🎵 Kompilasi libvorbis statis (cross ke Windows)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          export PKG_CONFIG_PATH="$HOME/ffmpeg-windows/lib/pkgconfig:$PKG_CONFIG_PATH"

          curl -L -o libvorbis.tar.gz "https://downloads.xiph.org/releases/vorbis/libvorbis-1.3.7.tar.gz"
          tar xzf libvorbis.tar.gz
          cd libvorbis-1.3.7

          ./configure \
            --prefix="$HOME/ffmpeg-windows" \
            --host=x86_64-w64-mingw32 \
            --with-ogg="$HOME/ffmpeg-windows" \
            --disable-shared \
            --enable-static

          make -j"$(nproc)"
          make install

      - name: 🎬 Kompilasi FFmpeg statis (cross ke Windows, target-os=mingw32)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        timeout-minutes: 40
        run: |
          git clone --depth 1 --branch "$FFMPEG_TAG" https://github.com/FFmpeg/FFmpeg.git ffmpeg-src
          cd ffmpeg-src
          
          export PKG_CONFIG_PATH="$HOME/ffmpeg-windows/lib/pkgconfig:$PKG_CONFIG_PATH"

          ./configure \
            --prefix="$HOME/ffmpeg-windows" \
            --enable-cross-compile \
            --cross-prefix=x86_64-w64-mingw32- \
            --arch=x86_64 \
            --target-os=mingw32 \
            --enable-static \
            --disable-shared \
            --disable-programs \
            --disable-doc \
            --disable-avdevice \
            --disable-avfilter \
            --enable-avcodec \
            --enable-avformat \
            --enable-swresample \
            --enable-swscale \
            --enable-pthreads \
            --disable-w32threads \
            --disable-dxva2 \
            --disable-d3d11va \
            --disable-d3d12va \
            --disable-mediafoundation \
            --enable-libdav1d \
            --enable-libmp3lame \
            --enable-libvorbis \
            --enable-asm \
            --enable-x86asm \
            --extra-cflags="-O3 -I$HOME/ffmpeg-windows/include" \
            --extra-ldflags="-L$HOME/ffmpeg-windows/lib" \
            --pkg-config="pkg-config --static" 
            
          make -j"$(nproc)"
          make install
          
          rm -f "$HOME/ffmpeg-windows/include/libavutil/hwcontext_d3d12va.h"

      - name: Set FFMPEG_DIR
        run: echo "FFMPEG_DIR=$HOME/ffmpeg-windows" >> "$GITHUB_ENV"

      - name: Pasang Python (host, buat jalanin maturin)
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Pasang Maturin
        timeout-minutes: 10
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install maturin

      - name: Setup linker cargo buat target windows-gnu
        run: |
          mkdir -p .cargo
          cat >> .cargo/config.toml <<'EOF'
          [target.x86_64-pc-windows-gnu]
          linker = "x86_64-w64-mingw32-gcc"
          ar = "x86_64-w64-mingw32-ar"
          rustflags = [
              "-C", "link-arg=-lws2_32",
              "-C", "link-arg=-lbcrypt",
              "-C", "link-arg=-luser32",
              "-C", "link-arg=-lsecur32",
              "-C", "link-arg=-lole32",
              "-C", "link-arg=-lcrypt32",
              "-C", "link-arg=-lncrypt",
              "-C", "link-arg=-Wl,--start-group",
              "-C", "link-arg=-ldav1d",
              "-C", "link-arg=-lmp3lame",
              "-C", "link-arg=-lvorbisenc",
              "-C", "link-arg=-lvorbis",
              "-C", "link-arg=-logg",
              "-C", "link-arg=-lmingwex",
              "-C", "link-arg=-lmsvcrt",
              "-C", "link-arg=-lkernel32",
              "-C", "link-arg=-Wl,--end-group"
          ]
          EOF

      - name: 🩹 Skip header AMX & SIMD intrinsics buat bindgen (Clang 21 mingw)
        run: |
          inc=/usr/lib/llvm-21/lib/clang/21/include
          if [ ! -d "$inc" ]; then
            inc="$(dirname "$(find /usr/lib -path '*/clang/*/include/immintrin.h' | head -n1)")"
          fi
          defs="$(grep -h -m1 '^#ifndef __AMX' "$inc"/amx*.h | awk '{print "-D"$2}' | sort -u | tr '\n' ' ')"
          simd_guards="-D_MM_MALLOC_H_INCLUDED -D__MM_MALLOC_H -D__X86INTRIN_H -D__IMMINTRIN_H -D__MMINTRIN_H -D__XMMINTRIN_H -D__EMMINTRIN_H -D__PMMINTRIN_H -D__TMMINTRIN_H -D__SMMINTRIN_H -D__NMMINTRIN_H -D__WMMINTRIN_H -D__AVXINTRIN_H -D__AVX2INTRIN_H -D__F16CINTRIN_H -D__FMAINTRIN_H"          
          echo "Header dir  : $inc"
          echo "Guard flags : $simd_guards $defs"
          echo "BINDGEN_EXTRA_CLANG_ARGS_x86_64_pc_windows_gnu=$simd_guards $defs" >> "$GITHUB_ENV"
          
      - name: ⚙️ Kompilasi Modul Rust (link ke FFmpeg hasil cross-compile)
        timeout-minutes: 30
        env:
          FFMPEG_SYS_NEXT_NO_VCPKG: "1"
          FFMPEG_SYS_NEXT_USE_PKG_CONFIG: "0"
        run: maturin build --release --target x86_64-pc-windows-gnu --out dist -vv

      - name: 🩺 Dump config.log FFmpeg kalau gagal
        if: failure()
        run: |
          if [ -f ffmpeg-src/ffbuild/config.log ]; then
            echo "==== ffmpeg-src/ffbuild/config.log (200 baris terakhir) ===="
            tail -n 200 ffmpeg-src/ffbuild/config.log
          fi
          find target -iname 'config.log' -exec sh -c 'echo "==== {} ===="; tail -n 200 "{}"' \; 2>/dev/null || true

      - name: 📋 Hasil
        run: ls -la dist/

      - name: 📤 Unggah Artefak
        uses: actions/upload-artifact@v4
        with:
          name: media-engine-windows-abi3
          path: dist/*.whl

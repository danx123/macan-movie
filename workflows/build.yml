name: Build Media Engine

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  cross-build-windows:
    name: Cross-compile Windows wheel (abi3)
    runs-on: ubuntu-latest
    env:
      # [FIX] Samakan minor version FFmpeg dengan `ffmpeg-next = "7.0"` di
      # Cargo.toml. ffmpeg-next punya banyak `match` Rust manual (pixel
      # format, codec ID, dll) yang di-generate/di-maintain untuk rentang
      # versi tertentu -- kalau FFmpeg yang dikompilasi lebih baru (mis.
      # n7.1) dan menambah varian enum baru, bindgen ikut memasukkannya ke
      # bindings.rs, tapi match statement di ffmpeg-next belum kenal varian
      # itu -> compile error E0004 "non-exhaustive patterns". Kalau nanti
      # mau naik ke FFmpeg 7.1, naikkan juga `ffmpeg-next` (dan
      # `ffmpeg-sys-next` transitif-nya) ke versi yang sudah support 7.1
      # secara eksplisit, jangan cuma ganti tag ini sendirian.
      FFMPEG_TAG: n7.1

    steps:
      - uses: actions/checkout@v4

      # 🧱 mingw-w64 = compiler + linker buat target Windows.
      # Paket -posix WAJIB dipilih (bukan -win32) karena FFmpeg butuh pthreads,
      # dan varian -win32 mingw-w64 default di Ubuntu gak punya itu.
      - name: Pasang toolchain cross mingw-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-mingw-w64-x86-64 \
            g++-mingw-w64-x86-64 \
            binutils-mingw-w64-x86-64 \
            nasm \
            yasm \
            pkg-config \
            make \
            diffutils \
            autoconf \
            automake \
            libtool \
            patch

          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix

      - name: Pasang Rust + target windows-gnu
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-gnu
          
      - name: Pasang Meson & Ninja (buat libdav1d)
        run: pip install meson ninja

      # 💾 [BARU] Cache hasil build statis FFmpeg (+ libdav1d + libmp3lame +
      # libogg + libvorbis) antar-run. Compile FULL FFmpeg dari nol (semua
      # codec/format aktif, gak dibatasi --disable-everything) di runner
      # 2 core kadang mepet/lewat batas timeout 40 menit -- ini salah satu
      # penyebab build "kadang gagal kadang enggak" tanpa error yang
      # konsisten. Key cache ikut FFMPEG_TAG + isi konfigurasi cross-compile
      # (lewat hash file ini sendiri), jadi otomatis invalidate kalau
      # tag/flag configure di atas diubah.
      #
      # [FIX] Step ini SENGAJA dipindah ke atas, SEBELUM step libdav1d &
      # libmp3lame di bawah. Sebelumnya step ini ada di bawah step libdav1d,
      # padahal step libdav1d punya `if: steps.ffmpeg-cache.outputs.cache-hit
      # != 'true'` -- referensi ke output step yang BELUM jalan itu resolve
      # ke string kosong, jadi kondisinya selalu true (libdav1d selalu
      # dikompilasi ulang tiap run, cache-nya gak pernah benar-benar
      # kepakai buat skip step itu). Sekarang id `ffmpeg-cache` sudah
      # ke-set duluan sebelum dipakai di step manapun di bawahnya.
      - name: 💾 Cache FFmpeg hasil cross-compile
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg-windows
          key: ffmpeg-windows-${{ env.FFMPEG_TAG }}-v18-mp3lame-vorbis-${{ hashFiles('.github/workflows/build.yml') }}

      - name: 🎬 Kompilasi libdav1d statis (cross ke Windows)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://code.videolan.org/videolan/dav1d.git dav1d-src
          cd dav1d-src
          
          # Bikin file konfigurasi cross-compile buat Meson
          cat <<EOF > cross_file.txt
          [binaries]
          c = 'x86_64-w64-mingw32-gcc-posix'
          cpp = 'x86_64-w64-mingw32-g++-posix'
          ar = 'x86_64-w64-mingw32-ar'
          strip = 'x86_64-w64-mingw32-strip'
          pkgconfig = 'pkg-config'
          windres = 'x86_64-w64-mingw32-windres'

          [host_machine]
          system = 'windows'
          cpu_family = 'x86_64'
          cpu = 'x86_64'
          endian = 'little'
          EOF
          
          # Setup build statis dan install ke folder prefix yang sama kayak FFmpeg
          meson setup build --cross-file cross_file.txt --default-library static --prefix="$HOME/ffmpeg-windows" --libdir="lib"
          ninja -C build
          ninja -C build install

      # 🎼 [BARU] Kompilasi libmp3lame statis (cross ke Windows). FFmpeg TIDAK
      # punya native MP3 encoder built-in -- satu-satunya cara encode ke MP3
      # itu lewat libmp3lame (external, lisensi LGPL jadi TIDAK perlu
      # --enable-gpl). Tanpa step ini, encoder "libmp3lame" yang dipakai
      # media_engine.convert_media() buat format .mp3 gagal runtime dengan
      # "Encoder audio 'libmp3lame' tidak ditemukan/tidak dikompilasi di
      # FFmpeg" -- itu penyebab persis error yang dilaporkan Jenny.
      # LAME pakai autotools biasa (bukan Meson/CMake kayak dav1d), support
      # cross-compile langsung lewat --host.
      - name: 🎼 Kompilasi libmp3lame statis (cross ke Windows)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          curl -L -o lame.tar.gz "https://sourceforge.net/projects/lame/files/lame/3.100/lame-3.100.tar.gz/download"
          tar xzf lame.tar.gz
          cd lame-3.100

          ./configure \
            --prefix="$HOME/ffmpeg-windows" \
            --host=x86_64-w64-mingw32 \
            --disable-shared \
            --enable-static \
            --disable-frontend

          make -j"$(nproc)"
          make install

      # 🎵 [BARU] Kompilasi libogg + libvorbis statis (cross ke Windows).
      # Sama seperti kasus libmp3lame: FFmpeg gak punya native OGG/Vorbis
      # encoder, satu-satunya jalan encode ke .ogg itu lewat libvorbis
      # (yang sendirinya butuh libogg buat container-nya). Tanpa dua lib
      # ini, "ogg" -> "libvorbis" di AUDIO_CODEC_BY_FORMAT
      # (macan_audio_converter.py) bakal gagal runtime dengan error yang
      # persis sama kelasnya kayak libmp3lame kemarin.
      #
      # Beda dengan LAME, libogg & libvorbis (autotools, bukan Meson) SAMA-
      # SAMA generate file .pc (ogg.pc, vorbis.pc, vorbisenc.pc) pas
      # `make install` -- jadi cukup diarahkan lewat PKG_CONFIG_PATH,
      # gak perlu --extra-cflags/--extra-ldflags manual kayak lame.
      # Urutan WAJIB: libogg dulu baru libvorbis (libvorbis --with-ogg
      # butuh libogg sudah ke-install di prefix yang sama).
      - name: 🎵 Kompilasi libogg statis (cross ke Windows)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          curl -L -o libogg.tar.gz "https://downloads.xiph.org/releases/ogg/libogg-1.3.5.tar.gz"
          tar xzf libogg.tar.gz
          cd libogg-1.3.5

          ./configure \
            --prefix="$HOME/ffmpeg-windows" \
            --host=x86_64-w64-mingw32 \
            --disable-shared \
            --enable-static

          make -j"$(nproc)"
          make install

      - name: 🎵 Kompilasi libvorbis statis (cross ke Windows)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          export PKG_CONFIG_PATH="$HOME/ffmpeg-windows/lib/pkgconfig:$PKG_CONFIG_PATH"

          curl -L -o libvorbis.tar.gz "https://downloads.xiph.org/releases/vorbis/libvorbis-1.3.7.tar.gz"
          tar xzf libvorbis.tar.gz
          cd libvorbis-1.3.7

          ./configure \
            --prefix="$HOME/ffmpeg-windows" \
            --host=x86_64-w64-mingw32 \
            --with-ogg="$HOME/ffmpeg-windows" \
            --disable-shared \
            --enable-static

          make -j"$(nproc)"
          make install
      # FFmpeg pas dia yang nge-drive proses cross-compile ("Unknown OS
      # 'windows'"). Makanya FFmpeg dikompilasi manual di sini dengan
      # --target-os=mingw32 yang benar, lalu ffmpeg-sys-next tinggal diarahkan
      # ke hasilnya lewat FFMPEG_DIR (lihat Cargo.toml: feature "build" udah
      # dimatiin khusus buat target Windows).
      - name: 🎬 Kompilasi FFmpeg statis (cross ke Windows, target-os=mingw32)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        timeout-minutes: 40
        run: |
          git clone --depth 1 --branch "$FFMPEG_TAG" https://github.com/FFmpeg/FFmpeg.git ffmpeg-src
          cd ffmpeg-src
          
          export PKG_CONFIG_PATH="$HOME/ffmpeg-windows/lib/pkgconfig:$PKG_CONFIG_PATH"

          # --extra-cflags/--extra-ldflags eksplisit di sini KHUSUS buat
          # libmp3lame: beda dengan dav1d (Meson otomatis generate
          # dav1d.pc yang ke-pickup lewat PKG_CONFIG_PATH di atas), LAME
          # (autotools polos) TIDAK generate file .pc sama sekali -- tanpa
          # baris ini, configure gak bakal nemu lame/lame.h & libmp3lame.a
          # yang di-install ke prefix custom ($HOME/ffmpeg-windows) di step
          # "Kompilasi libmp3lame statis" di atas, dan --enable-libmp3lame
          # bakal gagal diam-diam (fallback ke encoder gak ke-enable, bukan
          # error keras) sehingga error yang sama tetap muncul di runtime.
          ./configure \
            --prefix="$HOME/ffmpeg-windows" \
            --enable-cross-compile \
            --cross-prefix=x86_64-w64-mingw32- \
            --arch=x86_64 \
            --target-os=mingw32 \
            --enable-static \
            --disable-shared \
            --disable-programs \
            --disable-doc \
            --disable-avdevice \
            --disable-avfilter \
            --disable-postproc \
            --enable-avcodec \
            --enable-avformat \
            --enable-swresample \
            --enable-swscale \
            --enable-pthreads \
            --disable-w32threads \
            --disable-dxva2 \
            --disable-d3d11va \
            --disable-mediafoundation \
            --enable-libdav1d \
            --enable-libmp3lame \
            --enable-libvorbis \
            --extra-cflags="-I$HOME/ffmpeg-windows/include" \
            --extra-ldflags="-L$HOME/ffmpeg-windows/lib" \
            --pkg-config="pkg-config --static" 
            
          make -j"$(nproc)"
          make install

      # [BARU] Selalu set FFMPEG_DIR di sini (bukan di dalam step compile),
      # supaya tetap ke-set dengan benar walau step compile di atas di-skip
      # karena cache-hit -- sebelumnya env ini cuma di-export kalau step
      # compile benar-benar jalan.
      - name: Set FFMPEG_DIR
        run: echo "FFMPEG_DIR=$HOME/ffmpeg-windows" >> "$GITHUB_ENV"

      - name: Pasang Python (host, buat jalanin maturin)
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Pasang Maturin
        timeout-minutes: 10
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install maturin

      # 🔧 Cargo perlu tau linker mana yang dipakai buat target windows-gnu.
      - name: Setup linker cargo buat target windows-gnu
        run: |
          mkdir -p .cargo
          cat >> .cargo/config.toml <<'EOF'
          [target.x86_64-pc-windows-gnu]
          linker = "x86_64-w64-mingw32-gcc"
          ar = "x86_64-w64-mingw32-ar"
          rustflags = [
              "-C", "link-arg=-lws2_32",
              "-C", "link-arg=-lbcrypt",
              "-C", "link-arg=-luser32",
              "-C", "link-arg=-lsecur32",
              "-C", "link-arg=-lole32",
              "-C", "link-arg=-lcrypt32",
              # [FIX] Bungkus lib statis kita + runtime mingw pakai
              # --start-group/--end-group. `ld` itu single-pass (scan kiri
              # ke kanan sekali doang) -- tanpa group ini, `-lmp3lame` di
              # ujung command butuh simbol libc/libm (powf, sqrt, strcat,
              # fflush, ftell, __mingw_vsprintf, __imp_toupper dst) yang
              # ada di `-lmsvcrt`/`-lmingwex`, TAPI kedua lib itu sudah
              # "kelewat" diproses duluan (posisinya di depan command,
              # sebelum -l custom kita) -> ld gak balik nyari lagi ->
              # "undefined reference" walau fungsinya sebenarnya ada.
              # Dengan --start-group/--end-group, ld looping ulang di
              # dalam grup ini sampai semua simbol ke-resolve -- jadi juga
              # future-proof kalau nanti nambah lib statis lain lagi
              # (mis. libopus), gak perlu mikirin urutan manual per lib.
              "-C", "link-arg=-Wl,--start-group",
              "-C", "link-arg=-ldav1d",
              "-C", "link-arg=-lmp3lame",
              "-C", "link-arg=-lvorbisenc",
              "-C", "link-arg=-lvorbis",
              "-C", "link-arg=-logg",
              "-C", "link-arg=-lmingwex",
              "-C", "link-arg=-lmsvcrt",
              "-C", "link-arg=-lkernel32",
              "-C", "link-arg=-Wl,--end-group"
          ]
          EOF

      # ⚙️ FFmpeg udah dikompilasi manual di step sebelumnya dan diarahkan
      # lewat FFMPEG_DIR (env, sudah di-export ke $GITHUB_ENV). ffmpeg-sys-next
      # tinggal linking ke situ, gak nyoba compile ulang dari source lagi.
      - name: ⚙️ Kompilasi Modul Rust (link ke FFmpeg hasil cross-compile)
        timeout-minutes: 30
        env:
          FFMPEG_SYS_NEXT_NO_VCPKG: "1"
          FFMPEG_SYS_NEXT_USE_PKG_CONFIG: "0"
        run: maturin build --release --target x86_64-pc-windows-gnu --out dist -vv

      # 🩺 Kalau step kompilasi FFmpeg manual di atas gagal, config.log-nya
      # ada di ffmpeg-src/ffbuild/config.log. Kalau justru step linking modul
      # Rust yang gagal, cek dulu bagian "--- stderr"/"--- stdout" dari error
      # cargo/maturin di step sebelumnya (biasanya sudah cukup jelas untuk
      # kasus linker, bukan lagi soal configure FFmpeg).
      - name: 🩺 Dump config.log FFmpeg kalau gagal
        if: failure()
        run: |
          if [ -f ffmpeg-src/ffbuild/config.log ]; then
            echo "==== ffmpeg-src/ffbuild/config.log (200 baris terakhir) ===="
            tail -n 200 ffmpeg-src/ffbuild/config.log
          fi
          find target -iname 'config.log' -exec sh -c 'echo "==== {} ===="; tail -n 200 "{}"' \; 2>/dev/null || true

      - name: 📋 Hasil
        run: ls -la dist/

      - name: 📤 Unggah Artefak
        uses: actions/upload-artifact@v4
        with:
          name: media-engine-windows-abi3
          path: dist/*.whl
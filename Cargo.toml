[package]
name = "media_engine"
version = "0.5.5"
edition = "2021"

[dependencies]
pyo3 = { version = "0.29.3", features = ["extension-module", "abi3-py310", "generate-import-lib"] }
numpy = "0.29.0"
ndarray = "0.17"
cpal = "0.18"
ringbuf = "0.5.3"
rustfft = "6.4.1"
rayon = "1.12"

[target.'cfg(not(windows))'.dependencies]
ffmpeg-sys-next = { version = "=9.0.1", default-features = false }
ffmpeg-next = { version = "9.0.0", default-features = false, features = [
    "static",
    "build",
    "codec",
    "format",
    "software-resampling",
    "software-scaling"
] }

[target.'cfg(windows)'.dependencies]
ffmpeg-sys-next = { version = "=9.0.1", default-features = false }
ffmpeg-next = { version = "9.0.0", default-features = false, features = [
    "static",
    "codec",
    "format",
    "software-resampling",
    "software-scaling"
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
